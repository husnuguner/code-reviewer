# The complete, annotated catalogue -- every key the reviewer accepts, with its
# meaning, type and default. `reviewer init` writes a shorter starter
# (templates/config.yaml); copy what you need from here into
# ~/.config/reviewer/config.yaml and leave the rest out -- a key you omit takes
# the default shown here.
#
# Validated by tests/config-example.test.ts, so it can never drift from what
# the parser accepts.
#
# What goes where under ~/.config/reviewer/:
#   config.yaml   -> the defaults every project starts from, and the
#                    projects. The model's key may be NAMED here (an
#                    environment variable) or written here; naming keeps it
#                    shareable.
#   .env          -> the named secret: LLM_API_KEY.
#   prompts/      -> the review policy (who the reviewer is, what it looks
#                    for), as Markdown files; see defaults.prompts.
#   skills/       -> the review skills, one folder per project; see skills.
#
# Precedence, highest first: command line > exported environment >
# ~/.config/reviewer/.env > ./.env > the project > defaults > built-in.
# A value in .env therefore overrides the catalogue -- keep settings here.

# Schema version this file is written for. Optional; a newer number than the
# reviewer understands is refused with an "upgrade" message.
version: 3

# The settings every project starts from. Any key a project sets overrides
# the same key here; anything neither sets takes the built-in default noted
# on each key. Every key below is also allowed on a project (skills.mappings
# only there).
defaults:
  # ---- the model ---------------------------------------------------------
  llm:
    # claude (Anthropic) or local (any OpenAI-compatible server: LM Studio,
    # Ollama, vLLM...). Default local.
    provider: claude
    # The model name the provider expects. Default: the provider's own.
    model: claude-opus-5
    # Either the NAME of the environment variable holding the key or the key
    # itself. Required.
    api-key: LLM_API_KEY
    # Optional. For local: the server's OpenAI-compatible root; for claude:
    # a proxy. Default: the provider's public endpoint.
    # base-url: http://127.0.0.1:1234/v1

  # ---- language --------------------------------------------------------
  # Human language of the findings' text. ISO code or name. Default en.
  language: tr

  # ---- review policy ---------------------------------------------------
  # Files whose text, in this order, is the policy half of the system prompt:
  # who the reviewer is, what it looks for, what it leaves alone. `init`
  # writes the shipped policy to prompts/system.md beside this file; edit it,
  # or add files. Relative paths are taken from this file's directory;
  # absolute and ~ paths work too, and {{project}} stands for the project's
  # name. The other half -- how the diff is presented and the JSON that comes
  # back -- is the reviewer's and cannot be changed. Default []: the shipped
  # policy.
  prompts: [prompts/system.md]

  # Whether each file's findings are checked against its own diff by a second
  # model call before anything is reported, so that a finding the diff proves
  # wrong is dropped. It costs one extra call per file that found something,
  # and it only ever removes: the policy behind it is the reviewer's, not
  # yours, and it keeps a finding whenever the evidence falls short. Default
  # true; `--no-verify` turns it off for one run.
  verify: true

  # ---- skills ----------------------------------------------------------
  # The review skills. Here in defaults only the directory; which files each
  # skill reviews depends on a project's layout, so `mappings` live on the
  # project. Omit for no skills (the four built-in lenses review alone).
  skills:
    # Where the skill documents (*.md with a `name:` frontmatter) are.
    #   absolute or ~ path -> a directory on THIS machine; the usual home is
    #                         ~/.config/reviewer/skills/<project>.
    #   relative path      -> inside the REVIEWED repository, read from the
    #                         local checkout.
    # {{project}} stands for the project's name, so one shared path gives
    # every project its own folder. Default "": no skills.
    path: ~/.config/reviewer/skills/{{project}}
  # Per-skill body cap, in characters, before it is put in the prompt.
  # Default 10000.
  max-skill-chars: 10000
  # Cap for the whole skills block of one file. The first matching skill
  # always fits; later ones that would overflow are skipped and named in the
  # log. Default 18000.
  max-skills-total-chars: 18000

  # ---- pre-context -----------------------------------------------------
  # Before judging a file the reviewer fetches, from the repository at the
  # head: the exported signatures of the local modules the change imports,
  # the other files that mention exported symbols the change touches, and
  # the diffs of related changed files (same directory or same stem). This
  # caps that block, in characters; 0 switches it off. Default 6000.
  max-context-chars: 6000

  # ---- what is reviewed -----------------------------------------------
  # The checkout the review reads. Machine-specific, so usually on the
  # project; {{project}} works here too. Default: the current directory,
  # which is what a CI job wants.
  local-path: ~/Documents/workspace/{{project}}
  # Files skipped entirely (never sent to the model). Globs: ** spans
  # directories, * one segment, ? one character, [...] a class. A list or one
  # comma-separated string. `--exclude` adds more for a run. Default [].
  exclude:
    - "**/*.md"
    - "**/*.tsx"
    - "**/__tests__/**"
    - "**/*.spec.ts"
    - "**/*.test.ts"
    - "**/migration/*.ts"
    - "**/migrations/*.ts"
    - "**/.snapshot*.json"
    - "src/scripts/**"
  # Per-file cap on the diff (plus file content) shown to the model.
  # Default 8000.
  max-file-chars: 8000

  # ---- how much is reported --------------------------------------------
  # Max findings reported per file; the most severe survive and the rest are
  # counted into the run's `capped` tally. Default 3; 0 = no cap.
  max-findings-per-file: 3

  # ---- concurrency -----------------------------------------------------
  # File reviews (content read + model call) in flight at once.
  # Default 0: derived from CPU count.
  max-concurrent-files: 4

# Reviewable targets. With exactly one project, --project may be omitted.
projects:
  dfs-backend:
    # Any key from defaults may be overridden here (a section such as llm
    # merges key by key; prompts replaces the list, it does not append).
    llm:
      model: claude-sonnet-5
    language: tr
    prompts: [prompts/system.md, prompts/dfs-backend.md]
    verify: true
    # The checkout this project reviews. Omit to review the current
    # directory, which is what a CI job does after actions/checkout.
    local-path: ~/Documents/workspace/togg-trumore/dfs-backend
    exclude: ["**/*.md"]
    max-findings-per-file: 2
    max-file-chars: 8000
    max-skill-chars: 10000
    max-skills-total-chars: 18000
    max-context-chars: 6000
    max-concurrent-files: 4

    # The project's own: skill name -> glob or list of globs it reviews. A
    # mapping replaces the skill's own `applies_to`; a skill mapped nowhere
    # never applies; [] switches a skill off without touching the file. A
    # mapping naming a skill that does not exist is logged as a warning.
    # Default {}.
    #
    # This is the mapping for the Medusa library in docs/example-skills/.
    skills:
      mappings:
        medusa-conventions: ["src/**/*.ts"]
        medusa-route: ["src/api/**/route.ts"]
        medusa-auth: ["src/api/**/route.ts", "src/api/**/middlewares.ts"]
        medusa-validation:
          - "src/api/**/validation-schemas.ts"
          - "src/api/**/validation-schema.ts"
          - "src/api/**/validators.ts"
          - "src/api/**/middlewares.ts"
        medusa-model:
          - "src/modules/**/models/**/*.ts"
          - "src/modules/**/models.ts"
          - "src/modules/**/types/**/*.ts"
          - "src/modules/**/types.ts"
        medusa-module:
          - "src/modules/*/index.ts"
          - "src/modules/*/*/index.ts"
          - "src/modules/**/service.ts"
          - "src/modules/**/*-module-service.ts"
          - "src/modules/**/services/**/*.ts"
          - "src/modules/**/utils/**/*.ts"
          - "src/modules/**/state-machine/**/*.ts"
          - "medusa-config.ts"
        medusa-provider:
          - "src/modules/**/providers/**/*.ts"
          - "src/modules/**/loaders/**/*.ts"
          - "src/modules/**/*-provider-service.ts"
          - "src/modules/providers/**/*.ts"
          - "medusa-config.ts"
        medusa-links: ["src/links/**/*.ts"]
        medusa-workflow: ["src/workflows/**/*.ts"]
        medusa-subscriber: ["src/subscribers/**/*.ts"]
        medusa-scheduled-job: ["src/jobs/**/*.ts"]

  # A second project: the minimum that parses. It runs on the defaults (and,
  # having no skills.mappings, on the four lenses alone), against the current
  # directory.
  another: {}

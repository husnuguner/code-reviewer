# The release: a commit on main whose package.json names a version no GitHub
# Release has yet is tagged vX.Y.Z, published with that version's section of
# docs/changelog.md as the notes, and the major tag (v0) moves to it. Most
# pushes to main bump nothing; the gate says so and the rest is skipped.
#
# It runs after the Check workflow, and only when that passed on a push to
# main: what is released is what the gate let through. Nothing is built; the
# actions run from source at the tag. Every step is safe to run again: a tag
# already at this commit is kept, a Release already published ends the job.
name: Release

on:
  workflow_run:
    workflows: [Check]
    types: [completed]
    branches: [main]

permissions:
  contents: write

# Two pushes in a row release in order; the second finds the first's Release
# and stops.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: gate · tag · publish · move the major tag
    if: >-
      github.event.workflow_run.conclusion == 'success'
      && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      # The commit the Check ran on, which is not always main's newest.
      SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      - name: Check out
        # actions/checkout v6.1.0
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Decide whether this commit is a release
        id: gate
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          NOTES: ${{ runner.temp }}/release-notes.md
        run: |
          # package.json is the release signal: a version with no Release
          # yet is released, at this commit, with its changelog section as
          # the notes. Anything the gate does not understand is not released,
          # and said.
          set -euo pipefail
          decide() {
            echo "release=${1}" >> "${GITHUB_OUTPUT}"
            echo "tag=${2}" >> "${GITHUB_OUTPUT}"
            echo "Release: ${1} (${3})."
          }
          version="$(sed -n 's/^ *"version": *"\([^"]*\)".*/\1/p' package.json \
            | head -n 1)"
          tag="v${version}"
          if [[ ! "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::warning::package.json says '${version}', which is not" \
              "X.Y.Z; nothing is released from it."
            decide no "${tag}" "${version} is not a release version"
            exit 0
          fi
          if gh release view "${tag}" --json tagName > /dev/null 2>&1; then
            decide no "${tag}" "${tag} is released"
            exit 0
          fi
          # The section runs from its `## vX.Y.Z` heading to the next `## `.
          awk -v heading="## ${tag}" '
            $0 == heading { inside = 1; next }
            inside && /^## / { exit }
            inside { print }
          ' docs/changelog.md > "${NOTES}"
          if ! grep -q '[^[:space:]]' "${NOTES}"; then
            echo "::error::docs/changelog.md has no '## ${tag}' section," \
              "or an empty one. Write the release's notes there."
            exit 1
          fi
          echo "notes=${NOTES}" >> "${GITHUB_OUTPUT}"
          decide yes "${tag}" \
            "${tag} has no Release; notes are $(wc -l < "${NOTES}") line(s)"

      - name: Tag the commit
        if: steps.gate.outputs.release == 'yes'
        shell: bash
        env:
          TAG: ${{ steps.gate.outputs.tag }}
        run: |
          # An annotated tag at the commit the Check passed on. A tag this
          # version already has is kept if it is here -- an earlier run got
          # this far -- and refused if it is anywhere else: a version is
          # tagged once.
          set -euo pipefail
          ref="refs/tags/${TAG}"
          if git fetch -q origin "${ref}:${ref}" 2> /dev/null; then
            at="$(git rev-parse "${TAG}^{commit}")"
            if [ "${at}" != "${SHA}" ]; then
              echo "::error::${TAG} already exists at ${at:0:7}, which is" \
                "not this commit (${SHA:0:7}). Bump the version."
              exit 1
            fi
            echo "${TAG} already points here; not tagged again."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "${TAG}" -m "${TAG}" "${SHA}"
          git push origin "refs/tags/${TAG}"
          echo "${TAG} -> ${SHA:0:7}."

      - name: Publish the release
        if: steps.gate.outputs.release == 'yes'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.gate.outputs.tag }}
          NOTES: ${{ steps.gate.outputs.notes }}
        run: |
          set -euo pipefail
          gh release create "${TAG}" --verify-tag --title "${TAG}" \
            --notes-file "${NOTES}"

      - name: Move the major tag
        if: steps.gate.outputs.release == 'yes'
        shell: bash
        env:
          TAG: ${{ steps.gate.outputs.tag }}
        run: |
          # v0 follows the latest 0.x (README, "Versioning"). A tag pushed
          # with the workflow's token starts no workflow.
          set -euo pipefail
          major="${TAG%%.*}"
          git tag -f "${major}" "${TAG}"
          git push -f origin "refs/tags/${major}"
          echo "${major} -> ${TAG}."

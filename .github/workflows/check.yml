# The repository's own gate: `bun run check`, the same four steps a
# contributor runs before pushing (typecheck, lint, format:check, test), on
# the Bun this release is tested with (.bun-version). Nothing here calls a
# model or a hosting API; the actions under actions/ are exercised by their
# tests, not by running them.
name: Check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# One run per ref; a newer push cancels the one still going.
concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: typecheck · lint · format · test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out
        # actions/checkout v6.1.0
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: Set up Bun
        # oven-sh/setup-bun v2.2.0
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version-file: .bun-version

      - name: Install
        run: bun install --frozen-lockfile

      - name: Check
        run: bun run check

# Review every pull request, and let a CI bot do the talking.
#
# Two jobs on purpose. `review` runs the reviewer with no write permission at
# all: it reads the checkout's git, calls the model, and produces annotations,
# a job summary and an NDJSON artifact. `comment` is the only thing that can
# write to the conversation, and it does so from that artifact.
#
# The split is the safety property. The reviewer never holds a token that can
# post, so a prompt-injected diff cannot make it say anything on the pull
# request; the bot that can post never runs a model.

name: PR review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

# Two pushes in a minute should cost one review, not two.
concurrency:
  group: pr-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions: {}

jobs:
  review:
    name: Review the changed files
    runs-on: ubuntu-latest
    if: ${{ !github.event.pull_request.draft }}
    permissions:
      contents: read
    steps:
      - name: Check out the pull request head
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          # The reviewer diffs locally, so it needs history to find the
          # merge-base; a shallow clone would report every file as new.
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
          # Nothing here pushes, and a token left in .git/config is a token
          # the reviewed code could read.
          persist-credentials: false

      - name: Review
        id: review
        # In another repository: husnuguner/code-reviewer@v0.0.1
        uses: ./
        with:
          api-key: ${{ secrets.ANTHROPIC_API_KEY }}
          provider: claude
          model: claude-opus-5
          language: tr
          # The reviewed repository's own conventions, versioned with its
          # code: each changed file is reviewed under the skills whose globs
          # match its path.
          skills-path: .review/skills
          exclude: |
            **/*.md
            **/*.snap
            **/package-lock.json
          max-findings-per-file: 3
          # Report, do not block. Set to bug,security when the team wants the
          # build to hold on those.
          fail-on: none
          out: code-review.ndjson
          # The comment job below posts these as review comments; annotations
          # on top would show every finding twice.
          annotations: false

  comment:
    name: Post the findings as review comments
    needs: review
    # `always()` on purpose: a review that exits 3 on --fail-on still wrote
    # its findings and they still belong on the PR. What must NOT happen is
    # this job going green when there was nothing to post -- see the Comment
    # step's condition.
    if: ${{ always() && needs.review.result != 'cancelled' }}
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      # The poster is this repository's own code (`review-comment`), not a
      # script inlined here: it is typechecked, linted and unit-tested like
      # everything else, and it can be run by hand against a findings file.
      - name: Check out the reviewer
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      # `continue-on-error` keeps a missing artifact from failing the job
      # (the review job already reported *its* failure); the `id` lets the
      # next step ask whether anything actually arrived.
      - name: Download the findings
        id: findings
        # v7
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: code-review-findings
        continue-on-error: true

      # Only when there is something to post. Otherwise this step is
      # *skipped*, which is the truth -- not a green tick over a no-op that
      # would make "the review never ran" indistinguishable from "the review
      # found nothing".
      - name: Comment
        if: ${{ steps.findings.outcome == 'success' }}
        # In another repository: husnuguner/code-reviewer/comment-action@v0.0.1
        uses: ./comment-action
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          findings: code-review.ndjson

name: "code-reviewer"
description: >-
  Review a pull request's changed files with an LLM, reading the diff from the
  checkout's own git. Reports annotations on the changed lines, a job summary
  and an NDJSON artifact. Posts no comments and needs no repository write
  permission -- a CI bot downstream turns the NDJSON into comments.
author: "Hüsnü Güner"

branding:
  icon: "search"
  color: "purple"

inputs:
  base-ref:
    description: >-
      The ref to compare against. Defaults to the pull request's base branch,
      which is what `pull_request` events carry.
    required: false
    default: ""
  api-key:
    description: "The LLM key. Pass a secret; never a literal."
    required: true
  provider:
    description: >-
      LLM provider: claude, or local for an OpenAI-compatible server. On a
      runner the workflow is what names the model -- the machine-wide
      ~/.config/reviewer/config.yaml does not exist here -- so set this
      unless the checkout's .review/config.yaml pins llm.provider itself.
      Empty takes that file's value, else the tool's default (local).
    required: false
    default: ""
  model:
    description: >-
      Model name the provider expects. Empty uses the provider's default.
    required: false
    default: ""
  base-url:
    description: >-
      OpenAI-compatible endpoint, for provider: local (or a Claude proxy).
    required: false
    default: ""
  language:
    description: >-
      Language of the findings' text, e.g. tr or en. Empty takes the
      checkout's config.
    required: false
    default: ""
  skills-path:
    description: >-
      Where this repository's review skills live, relative to the checkout.
      Unnecessary when the checkout has a .review/config.yaml: that file
      already says. Each changed file is reviewed under the skills whose
      globs match its path, on top of the standing lenses.
    required: false
    default: ""
  incremental:
    description: >-
      On a `synchronize` event, review only the commits the push added:
      the diff from the previous head (`github.event.before`) to the new one,
      instead of from the merge-base. Fail-closed: when the previous head is
      not in the checkout (a force-push), is not an ancestor of the new one,
      or the base branch was merged in between, the whole range is reviewed
      as usual, and the log says why. Other events (opened, reopened,
      ready_for_review, workflow_dispatch) always review the whole range. The
      summary record then carries `incremental: true`, and the comment action
      leaves earlier verdicts standing rather than superseding them.
    required: false
    default: "false"
  policy-ref:
    description: >-
      Whose .review/ the review is held to. "base" (the default) reads the
      config, prompts and skills from the base branch, so a pull request
      cannot loosen the rules it is reviewed under; "head" reads the
      checkout's own. Either way a pull request that edits .review/ is
      named in the summary and in the posted comment. Ignored when `config`
      names a file.
    required: false
    default: "base"
  config:
    description: >-
      Path to a repository config.yaml, in place of the one policy-ref would
      read. Usually unnecessary: a checkout that carries its own
      .review/config.yaml (written by `reviewer init`) supplies its skills,
      prompts and mappings. Set this only to point at a different file.
    required: false
    default: ""
  exclude:
    description: "Newline- or comma-separated globs to skip entirely."
    required: false
    default: ""
  max-findings-per-file:
    description: >-
      Max findings reported per file; the most severe survive. 0 = no cap.
      Empty takes the checkout's config.
    required: false
    default: ""
  fail-on:
    description: >-
      Severities that fail the job, e.g. "bug,security". "none" (the default)
      never fails it: the review informs, the humans decide.
    required: false
    default: "none"
  verify:
    description: >-
      Check each file's findings against its own diff and drop the refuted
      ones (one extra model call per file that found something). Empty takes
      the checkout's config (default on).
    required: false
    default: ""
  preview:
    description: >-
      Print which files would be reviewed and stop. Calls no model, so it
      costs nothing and needs no key -- useful for testing the wiring.
    required: false
    default: "false"
  out:
    description: >-
      Where the NDJSON record stream is written, for a CI bot to read.
    required: false
    default: "code-review.ndjson"
  upload-artifact:
    description: "Upload the NDJSON as a workflow artifact."
    required: false
    default: "true"
  annotations:
    description: >-
      Write each finding as a GitHub annotation on its changed line, plus a
      job summary. Right when nothing else puts the findings on the PR: it
      needs no write permission. Set to "false" when a comment job posts
      them as review comments, or every finding shows twice.
    required: false
    default: "true"
  log-level:
    description: >-
      How much the run says on stderr: debug, info, warn, error, silent.
      Empty leaves it to the runner -- which means INFO, or DEBUG when the
      job is re-run with debug logging (RUNNER_DEBUG). Logs never touch
      stdout, so this cannot affect the findings.
    required: false
    default: ""
  bun-version:
    description: >-
      Bun the reviewer runs on. Empty takes the version this release was
      tested with (the repository's .bun-version).
    required: false
    default: ""

outputs:
  findings-file:
    description: >-
      Path to the NDJSON record stream (findings, then one summary record).
    value: ${{ steps.review.outputs.findings-file }}
  findings:
    description: "How many findings were reported."
    value: ${{ steps.review.outputs.findings }}
  range:
    description: >-
      What was reviewed: "full" (from the merge-base) or "since" (only the
      commits the push added, with `incremental: true`).
    value: ${{ steps.range.outputs.range }}
  range-reason:
    description: "Why that range: one short phrase."
    value: ${{ steps.range.outputs.reason }}

runs:
  using: composite
  steps:
    - name: Resolve the base ref
      id: base
      shell: bash
      env:
        BASE_REF: ${{ inputs.base-ref || github.event.pull_request.base.ref }}
      run: |
        set -euo pipefail
        if [ -z "${BASE_REF}" ]; then
          echo "::error::No base ref: pass base-ref, or run this on a" \
            "pull_request event."
          exit 1
        fi
        if [[ ! "${BASE_REF}" =~ ^[A-Za-z0-9][A-Za-z0-9._/-]*$ ]]; then
          echo "::error::Refusing a base ref that is not a plain git ref name."
          exit 1
        fi
        remote="refs/remotes/origin/${BASE_REF}"
        if ! git -C "${GITHUB_WORKSPACE}" rev-parse --verify --quiet \
          "${remote}" >/dev/null; then
          echo "origin/${BASE_REF} is not in the checkout; fetching it."
          if ! git -C "${GITHUB_WORKSPACE}" fetch --no-tags origin \
            "+${BASE_REF}:${remote}"; then
            echo "::error::Could not resolve origin/${BASE_REF}." \
              "Check out with 'fetch-depth: 0' so the base branch is" \
              "present, or leave 'persist-credentials' on so it can be" \
              "fetched."
            exit 1
          fi
        fi
        echo "ref=${BASE_REF}" >> "${GITHUB_OUTPUT}"

    - name: Resolve the range
      id: range
      shell: bash
      env:
        INCREMENTAL: ${{ inputs.incremental }}
        EVENT_NAME: ${{ github.event_name }}
        EVENT_ACTION: ${{ github.event.action }}
        BEFORE: ${{ github.event.before }}
        BASE_REF: ${{ steps.base.outputs.ref }}
      run: |
        # Decides between the whole range (merge-base..HEAD) and only what the
        # push added (before..HEAD). Every doubt resolves to the whole range:
        # reviewing too much costs tokens, reviewing too little hides a finding.
        set -euo pipefail
        decide() {
          echo "range=${1}" >> "${GITHUB_OUTPUT}"
          echo "reason=${2}" >> "${GITHUB_OUTPUT}"
          echo "since=${3:-}" >> "${GITHUB_OUTPUT}"
          echo "Range: ${1} (${2})."
        }
        g() { git -C "${GITHUB_WORKSPACE}" "$@"; }
        if [ "${INCREMENTAL}" != "true" ]; then
          decide full "incremental is off"
          exit 0
        fi
        if [ "${EVENT_NAME}" != "pull_request" ] \
          || [ "${EVENT_ACTION}" != "synchronize" ]; then
          decide full \
            "event ${EVENT_NAME}/${EVENT_ACTION:-none} asks for the whole range"
          exit 0
        fi
        if [[ ! "${BEFORE}" =~ ^[0-9a-f]{40}$ ]]; then
          decide full "no previous head on the event"
          exit 0
        fi
        short="${BEFORE:0:7}"
        if ! g cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
          reason="previous head ${short} is not in the checkout"
          decide full "${reason} (force-push, or a shallow clone)"
          exit 0
        fi
        if ! g merge-base --is-ancestor "${BEFORE}" HEAD; then
          decide full \
            "previous head ${short} is not an ancestor of HEAD (force-push)"
          exit 0
        fi
        if [ "$(g rev-parse HEAD)" = "${BEFORE}" ]; then
          decide full "HEAD is the previous head; nothing was added"
          exit 0
        fi
        base="refs/remotes/origin/${BASE_REF}"
        if [ "$(g merge-base "${base}" "${BEFORE}")" \
          != "$(g merge-base "${base}" HEAD)" ]; then
          decide full "the base branch was merged or rebased in since ${short}"
          exit 0
        fi
        decide since "only the commits after ${short}" "${BEFORE}"

    - name: Read the policy from the base branch
      id: policy
      shell: bash
      env:
        POLICY_REF: ${{ inputs.policy-ref }}
        CONFIG_INPUT: ${{ inputs.config }}
        BASE_REF: ${{ steps.base.outputs.ref }}
        POLICY_DIR: ${{ runner.temp }}/review-policy
      run: |
        # The checkout is the pull request's, .review/ included. Its rules are
        # read from the base branch instead, into a directory outside the
        # checkout, so a change that loosens them is reviewed under the rules
        # it is trying to loosen. The working tree is not touched.
        set -euo pipefail
        if [ -n "${CONFIG_INPUT}" ] || [ "${POLICY_REF}" = "head" ]; then
          echo "config=${CONFIG_INPUT}" >> "${GITHUB_OUTPUT}"
          exit 0
        fi
        if [ "${POLICY_REF}" != "base" ]; then
          echo "::error::policy-ref must be 'base' or 'head';" \
            "got '${POLICY_REF}'."
          exit 1
        fi
        rm -rf "${POLICY_DIR}"
        mkdir -p "${POLICY_DIR}/.review"
        base="refs/remotes/origin/${BASE_REF}"
        repo=(git -C "${GITHUB_WORKSPACE}")
        if "${repo[@]}" cat-file -e "${base}:.review/config.yaml" 2>/dev/null; then
          "${repo[@]}" archive "${base}" .review | tar -x -C "${POLICY_DIR}"
          echo "Review policy: .review/ as origin/${BASE_REF} has it."
        else
          # No policy on the base branch: an empty file, so the checkout's own
          # .review/ is not found by the walk-up either.
          printf 'version: 1\n' > "${POLICY_DIR}/.review/config.yaml"
          echo "Review policy: origin/${BASE_REF} carries no .review/;" \
            "the checkout's is not read."
        fi
        echo "config=${POLICY_DIR}/.review/config.yaml" >> "${GITHUB_OUTPUT}"

    - name: Set up Bun
      uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      with:
        bun-version: ${{ inputs.bun-version }}
        bun-version-file: >-
          ${{ format('{0}/../../.bun-version', github.action_path) }}

    - name: Install the reviewer
      shell: bash
      working-directory: ${{ github.action_path }}/../..
      run: |
        set -euo pipefail
        bun install --frozen-lockfile --production --ignore-scripts

    - name: Review
      id: review
      shell: bash
      working-directory: ${{ github.workspace }}
      env:
        LLM_API_KEY: ${{ inputs.api-key }}
        IN_PROVIDER: ${{ inputs.provider }}
        IN_MODEL: ${{ inputs.model }}
        IN_BASE_URL: ${{ inputs.base-url }}
        IN_LANGUAGE: ${{ inputs.language }}
        IN_SKILLS_PATH: ${{ inputs.skills-path }}
        IN_EXCLUDE: ${{ inputs.exclude }}
        IN_MAX_FINDINGS: ${{ inputs.max-findings-per-file }}
        IN_VERIFY: ${{ inputs.verify }}
        IN_LOG_LEVEL: ${{ inputs.log-level }}
        REVIEWER_CONFIG: ${{ steps.policy.outputs.config }}
        FAIL_ON: ${{ inputs.fail-on }}
        OUT_FILE: ${{ inputs.out }}
        PREVIEW: ${{ inputs.preview }}
        ANNOTATIONS: ${{ inputs.annotations }}
        REVIEWER: ${{ github.action_path }}/../../src/cli/main.ts
        BASE_REF: ${{ steps.base.outputs.ref }}
        SINCE: ${{ steps.range.outputs.since }}
      run: |
        # The runner starts this shell with -e, which `set -uo pipefail`
        # does not undo. Off it goes, for two reasons: the reviewer's exit
        # status is this step's to report (read below, after the outputs are
        # written), and a guard that declines is an answer, not a failure --
        # a function whose body ends in a false test returns 1, and under -e
        # that ends the step before the reviewer is ever spawned.
        set +e
        set -uo pipefail
        set_if_given() { [ -n "${2}" ] && export "${1}=${2}"; return 0; }
        set_if_given LLM_PROVIDER "${IN_PROVIDER}"
        set_if_given LLM_MODEL "${IN_MODEL}"
        set_if_given LLM_BASE_URL "${IN_BASE_URL}"
        set_if_given REVIEW_LANG "${IN_LANGUAGE}"
        set_if_given REVIEW_SKILLS_PATH "${IN_SKILLS_PATH}"
        set_if_given REVIEW_EXCLUDE_PATHS "${IN_EXCLUDE}"
        set_if_given REVIEW_MAX_FINDINGS_PER_FILE "${IN_MAX_FINDINGS}"
        set_if_given REVIEW_VERIFY "${IN_VERIFY}"
        # The reviewed side is the checkout: what actions/checkout put here. The
        # other side is the base branch, or -- for an incremental run -- the
        # previous head the range step settled on.
        args=(review)
        if [ -n "${SINCE:-}" ]; then
          args+=(--since "${SINCE}")
        else
          args+=(--base "origin/${BASE_REF}")
        fi
        args+=(--fail-on "${FAIL_ON}")
        args+=(--log-format github)
        if [ -n "${IN_LOG_LEVEL}" ]; then
          args+=(--log-level "${IN_LOG_LEVEL}")
        fi
        if [ "${PREVIEW}" = "true" ]; then
          args+=(--preview)
        elif [ "${ANNOTATIONS}" = "false" ]; then
          args+=(--format ndjson --out "${OUT_FILE}")
          quiet=1
        else
          args+=(--format github --out "${OUT_FILE}")
        fi
        if [ -n "${REVIEWER_CONFIG}" ]; then
          args+=(--config "${REVIEWER_CONFIG}")
        else
          unset REVIEWER_CONFIG
        fi

        if [ "${quiet:-0}" = "1" ]; then
          bun --no-env-file "${REVIEWER}" "${args[@]}" >/dev/null
        else
          bun --no-env-file "${REVIEWER}" "${args[@]}"
        fi
        status=$?

        echo "findings-file=${OUT_FILE}" >> "${GITHUB_OUTPUT}"
        if [ -f "${OUT_FILE}" ]; then
          count=$(grep -c '"type":"finding"' "${OUT_FILE}" || true)
        else
          count=0
        fi
        echo "findings=${count}" >> "${GITHUB_OUTPUT}"

        exit $status

    - name: Upload the findings
      if: >-
        ${{ always() && inputs.upload-artifact == 'true'
        && inputs.preview != 'true' }}
      # v7
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: code-review-findings
        path: ${{ inputs.out }}
        if-no-files-found: ignore

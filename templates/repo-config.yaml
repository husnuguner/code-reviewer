# This repository's review setup. Commit this directory: the team and CI read
# the same rules from it. Every key, with its meaning and default, is in the
# annotated reference the reviewer ships: templates/config.example.yaml.
#
# The reviewer reads LOCAL GIT and reports; it posts nothing. Turning findings
# into pull-request comments is a CI bot's job (reviewer comment).
#
# This file sits on top of the machine's ~/.config/reviewer/config.yaml: a
# setting restated here wins for this repository; `llm` merges key by key.
version: 1

# This repository's settings, on top of the machine's.
settings:
  # The model is the environment's business, not this file's: on a developer's
  # machine ~/.config/reviewer/config.yaml names it; on a CI runner the action's
  # inputs (provider, model, api-key) do. Restate a key here only to pin it for
  # this repository -- and mind that an LLM_* variable still wins over it.
  # llm:
  #   model: claude-opus-4

  # What is never sent to the model: generated and lock files, not tests or
  # migrations -- the review policy reads both (a test that cannot fail, a
  # migration that cannot be rolled back are findings).
  exclude: ["**/*.lock", "**/package-lock.json", "**/*.min.js", "**/*.snap"]
  max-findings-per-file: 3 # the most severe survive; the rest are counted

# The review policy -- who the reviewer is, what it looks for, what it leaves
# alone -- is the reviewer's own and cannot be replaced. What THIS repository
# adds to it: prompts/ beside this file for what holds on every file, and
# skills/ below for what holds on the paths a mapping names.

# Standing instructions are not configured: every *.md under .review/prompts/
# is read, in path order, and appended to the policy for every reviewed file.
# `reviewer init` leaves prompts/prompts.md there, empty -- fill it in, or add
# more files beside it. While every file here is empty, the machine's
# ~/.config/reviewer/prompts/ is read instead.

skills:
  # Every relative path in this file is taken from its own directory
  # (.review/), so this means .review/skills.
  path: skills
  # The baseline: the skills every file these globs match is held to. This is
  # where a language's standing rules go, stated once for all of them.
  defaults: []
  # - globs: ["**/*.ts", "**/*.tsx"]
  #   skills: [typescript-base]
  # skill name -> the globs only it reviews, added to what `defaults` gave it;
  # a skill in neither table never applies, and [] switches one off.
  mappings: {}
  # api-rules: ["src/api/**/*.ts"]

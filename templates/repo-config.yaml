# This repository's review setup. Commit this directory: the team and CI read
# the same rules from it. Every key, with its meaning and default, is in the
# annotated reference the reviewer ships: templates/config.example.yaml.
#
# The reviewer reads LOCAL GIT and reports; it posts nothing. Turning findings
# into pull-request comments is a CI bot's job (reviewer comment).
#
# Secret: llm.api-key names an environment variable. Put the key in
# ~/.config/reviewer/.env, or in .review/.env (gitignored) -- never here.
version: 1

defaults:
  llm:
    provider: claude # or: local (any OpenAI-compatible server)
    model: claude-opus-5
    api-key: ANTHROPIC_API_KEY # the variable holding the key
    # base-url: http://127.0.0.1:1234/v1
  language: en
  # The review policy -- who the reviewer is, what it looks for, what it leaves
  # alone -- is the reviewer's own and cannot be replaced. What THIS repository
  # adds to it: prompts/ beside this file for what holds on every file, and
  # skills/ for what holds on the paths a mapping names.
  exclude: ["**/*.spec.ts", "**/*.test.ts", "**/migrations/*.ts"]
  max-findings-per-file: 3 # the most severe survive; the rest are counted

# Standing instructions are not configured: every *.md under .review/prompts/
# is read, in path order, and appended to the policy for every reviewed file.
# `reviewer init` leaves prompts/prompts.md there, empty -- fill it in, or add
# more files beside it; an empty one adds nothing.

projects:
  # One project: this repository. No local-path -- the reviewer already knows
  # where it is, because this file is inside it.
  this-repo:
    skills:
      # Every relative path in this catalogue is taken from the catalogue's own
      # directory (.review/), so this means .review/skills.
      path: skills
      # skill name -> globs it reviews; a skill mapped nowhere never applies.
      # This is where your rules go: map one to ["**/*"] to apply it everywhere.
      mappings: {}
      # api-rules: ["src/api/**/*.ts"]

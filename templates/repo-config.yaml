# This repository's review setup. Commit this directory: the team and CI read
# the same rules from it. Every key, with its meaning and default, is in
# docs/config.example.yaml of the reviewer's repository.
#
# The reviewer reads LOCAL GIT and reports; it posts nothing. Turning findings
# into pull-request comments is a CI bot's job (review-comment).
#
# Secret: llm.api-key names an environment variable. Put the key in
# ~/.config/reviewer/.env, or in .review/.env (gitignored) -- never here.
version: 3

defaults:
  llm:
    provider: claude # or: local (any OpenAI-compatible server)
    model: claude-opus-5
    api-key: ANTHROPIC_API_KEY # the variable holding the key
    # base-url: http://127.0.0.1:1234/v1
  language: en
  prompts: [prompts/system.md] # the review policy, beside this file
  exclude: ["**/*.spec.ts", "**/*.test.ts", "**/migrations/*.ts"]
  max-findings-per-file: 3 # the most severe survive; the rest are counted

projects:
  # One project: this repository. No local-path -- the reviewer already knows
  # where it is, because this file is inside it.
  this-repo:
    skills:
      # Beside this file, like `prompts` above: every relative path in this
      # catalogue is taken from the catalogue's own directory (.review/).
      path: skills
      mappings: {} # skill name -> globs it reviews; a skill mapped nowhere never applies
      # api-rules: ["src/api/**/*.ts"]

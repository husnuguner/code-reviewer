# code-reviewer -- the catalogue. Every key, with its meaning and default, is
# documented in the annotated reference the reviewer ships beside this
# template: templates/config.example.yaml.
#
# This reviewer reads LOCAL GIT and reports; it posts nothing and talks to no
# hosting system. A project is therefore a checkout plus the rules that apply
# to it. Turning findings into pull-request comments is a CI bot's job,
# reading the NDJSON the reviewer prints (--out).
#
# Secrets: llm.api-key takes either the NAME of an environment variable (read
# from the environment and from the .env beside this file) or the value
# itself. Naming a variable keeps this file shareable.
version: 3

# What every project starts from. A project overrides a key by restating it.
defaults:
  llm:
    provider: claude # or: local (any OpenAI-compatible server)
    model: claude-opus-5
    api-key: LLM_API_KEY # the variable holding the key, or the key
    # base-url: http://127.0.0.1:1234/v1
  language: en
  prompts: [prompts/system.md] # the review policy; edit the file or add more
  skills:
    path: ~/.config/reviewer/skills/{{project}} # one folder per project
  exclude: ["**/*.spec.ts", "**/migrations/*.ts"]
  max-findings-per-file: 3 # the most severe survive; the rest are counted

projects:
  example:
    # The checkout to review. Omit to review the current directory, which is
    # what a CI job does after actions/checkout.
    local-path: ~/src/repo
    skills:
      mappings: # skill name -> globs it reviews
        api-routes: ["src/api/**/route.ts"]

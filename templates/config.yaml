# code-reviewer -- this machine's settings. Every key, with its meaning and
# default, is documented in the annotated reference the reviewer ships beside
# this template: templates/config.example.yaml.
#
# Two files, one shape. This one says HOW the reviewer runs on this machine:
# the model, its key's name, the findings' language, how much runs at once.
# Each repository's .review/config.yaml (written by `reviewer init` inside a
# checkout) says WHAT is reviewed there -- skills, excludes, caps -- and sits on
# top of this file: a key restated under its `settings` wins; `llm` merges key
# by key. What describes the reviewed code (`skills`) cannot be set here.
#
# Secrets: llm.api-key takes either the NAME of an environment variable (read
# from the environment and from the .env beside this file) or the value
# itself. Naming a variable keeps this file shareable.
version: 1

settings:
  llm:
    provider: claude # or: local (any OpenAI-compatible server)
    model: claude-sonnet-4-6
    api-key: ANTHROPIC_API_KEY # the variable holding the key, or the key
    # base-url: http://127.0.0.1:1234/v1
  language: en
  max-concurrent-files: 4 # file reviews in flight at once

# Standing instructions are not configured: every *.md under prompts/ beside
# this file is read and appended to the policy for every reviewed file -- but
# only for a repository whose own .review/prompts/ says nothing.

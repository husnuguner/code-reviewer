# Every key the reviewer accepts, with its default. Nothing writes this file:
# `reviewer init` writes a starter beside it (config.yaml outside a checkout,
# repo-config.yaml inside one). Copy what you need; an omitted key takes its
# default. A test (tests/core/config/config-example.test.ts) keeps it in step
# with the parser.
#
# Two files share this shape:
#   ~/.config/reviewer/config.yaml  this machine: `settings` -- the model, its
#                                   key's name, language, concurrency
#   <repo>/.review/config.yaml      that repository: `skills`, plus any
#                                   `settings` key restated to override the
#                                   machine's for this repository
# Beside each: .env (the named secret) and prompts/ (every *.md is appended to
# the policy for every reviewed file; the repository's when it says anything,
# else the machine's). The review policy itself ships with the reviewer and is
# not configurable.
#
# Precedence, highest first: command line > environment > .env > the
# repository's file > the machine's file > built-in.

# Schema version. Optional; a newer number than this build knows is refused.
version: 1

# How the reviewer runs. Set once on the machine; a repository restates the
# keys it wants otherwise, and `llm` merges key by key.
settings:
  llm:
    provider: claude # or: local (any OpenAI-compatible server). Default local
    model: claude-sonnet-4-6 # default: the provider's own
    # The variable holding the key -- yours to name. Required.
    api-key: ${ANTHROPIC_API_KEY}
    # local: the server's root; claude: a proxy. Default: the public endpoint
    # base-url: http://127.0.0.1:1234/v1

  language: tr # findings' language, ISO code or name. Default en
  verify: true # a second pass drops findings their diff disproves. Default true
  # A comment in the code reading `reviewer: by-pass - <reason>` takes the block
  # after it out of review; the run names every such region. Default true
  bypass-markers: true

  # Files never sent to the model. Globs, as a list or one comma-separated
  # string; `--exclude` adds more for a run. Default []. Set in the machine's
  # file, this makes a local run differ from CI, where that file does not exist.
  exclude:
    - "**/*.md"
    - "**/*.tsx"
    - "**/__tests__/**"
    - "**/*.spec.ts"
    - "**/*.test.ts"
    - "**/migration/*.ts"
    - "**/migrations/*.ts"
    - "**/.snapshot*.json"
    - "src/scripts/**"

  max-findings-per-file: 3 # the most severe survive; 0 = no cap. Default 3

  # The pre-context read from the checkout for each file: the signatures of the
  # modules it imports, who else uses the exports it changes, and the diffs of
  # the changed files an import binds to it.
  context:
    # Cap on the whole block, which its parts share -- so a long run of imported
    # signatures cannot crowd the related diffs out. 0 switches it off entirely.
    max-chars: 12000
    max-definitions: 4 # imported modules whose signatures are read. Default 4
    max-symbols: 6 # changed exports searched for; one search each. Default 6
    max-usages-per-symbol: 8 # paths listed per changed export. Default 8
    max-related: 3 # related diffs, import-bound first. Default 3

  max-concurrent-files: 4 # file reviews in flight. Default 0: from CPU count

# REPOSITORY FILE ONLY. Skills describe the reviewed code, so the machine's
# file may not set them; `reviewer` refuses the file if it does.
skills:
  # Where the skill documents are; a relative path is taken from beside this
  # file, so in .review/config.yaml `skills` means .review/skills. Default "":
  # no skills.
  path: skills
  # Cap on one skill's body, in characters. The block a file carries has one
  # fixed ceiling (200000) rather than a second setting: a block that long is a
  # mapping mistake, not a budget. No environment alias. Default 10000.
  max-chars: 10000
  # The baseline: the skills every file these globs match is held to, whatever
  # `mappings` adds. This is where a language's or an area's standing rules go,
  # stated once instead of repeated under each skill that shares them. Each
  # side takes a list or one bare string; a list of entries and not an object
  # keyed by glob because a config key is a dotted path and every useful glob
  # carries a dot. A skill named here that was not loaded is warned about.
  # Default [].
  defaults:
    - globs: ["**/*.ts", "**/*.tsx"]
      skills: [typescript-base, naming]
    - globs: "**/*"
      skills: house-rules
  # skill name -> the globs only it reviews, ADDED to what `defaults` gave it:
  # a list, one bare glob, or [] to switch a skill off (baseline included)
  # without deleting its file. A skill named in neither table never applies,
  # and a mapping naming no skill is warned about. Default {}.
  mappings:
    api-rules: ["src/api/**/route.ts", "src/api/**/middlewares.ts"]
    data-model: "src/modules/**/models/**/*.ts"
    background-jobs: []

# Bun reads .env / .env.local from the working directory into process.env
# before any code runs. The reviewer reads its .env files itself
# (src/providers/config/environment-files.ts) and never the working
# directory's: that directory is the checkout under review, and a change can
# add a .env to it. Letting Bun promote it to the real environment would hand
# it the strongest layer. Off here for everything run from this repository
# (tests, scripts); the executable carries the same decision in its shebang,
# because a checkout they review has no say in it.
env = false

[run]
# node_modules/.bin tools (tsc, eslint, prettier) declare `#!/usr/bin/env node`;
# run them with Bun so that Node is not a second runtime this repository needs.
bun = true

[test]
# No `root`: the application's tests live in `tests/`, mirroring `src/`, and
# `src/lib/` carries its own beside the code it covers -- a library meant to
# be liftable out of this repository has to be testable without the
# application's harness. Pinning the root to `tests/` would have made the
# second set silently invisible: `bun test` would pass, having run none of it.
# The per-test timeout is documented here but not honoured by 1.4.x
# (oven-sh/bun#38728); the `test` script passes `--timeout` on the command line.
